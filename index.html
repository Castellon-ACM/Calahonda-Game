<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calahonda Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
  }
  .screen {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hidden { display: none; }

  .login-card {
    background: #161616;
    border: 1px solid #262626;
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 340px;
  }
  .login-card h1 {
    color: #fff;
    font-size: 22px;
    margin-bottom: 24px;
    text-align: center;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    color: #9a9a9a;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2e2e2e;
    background: #0d0d0d;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .field input:focus {
    border-color: #5b8cff;
  }
  .login-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #5b8cff;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .login-btn:active {
    opacity: 0.85;
  }
  .error {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    display: none;
  }

  /* Pantalla en blanco tras el login */
  #app-screen {
    background: #ffffff;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

  <!-- Pantalla de Login -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>Calahonda Game</h1>
      <form id="login-form">
        <div class="field">
          <label for="email">Usuario</label>
          <input type="text" id="email" placeholder="tu usuario" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Entrar</button>
        <div class="error" id="error-msg">Rellena usuario y contraseña</div>
      </form>
    </div>
  </div>

  <!-- Pantalla tras el login: en blanco -->
  <div id="app-screen" class="screen hidden"></div>

  <script>
    const form = document.getElementById('login-form');
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';

      // Aquí iría la validación real contra un backend.
      // Por ahora, cualquier usuario/contraseña no vacíos entran.
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
    });
  </script>

</body>
</html>
