<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alcohol 365</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1a1208 0%, #0d0a05 60%, #000 100%);
  }

  .screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .hidden { display: none; }

  /* ---------- Logo moneda 3D ---------- */
  .coin-wrap {
    perspective: 800px;
    margin-bottom: 20px;
  }
  .coin {
    width: 110px;
    height: 110px;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 3.2s linear infinite;
  }
  @keyframes spin {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  .coin-face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    backface-visibility: hidden;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #d4a017 45%, #8a6200 100%);
    border: 3px solid #a97a12;
    box-shadow: 0 0 18px rgba(255, 205, 90, 0.45), inset 0 0 12px rgba(0,0,0,0.35);
  }
  .coin-face.back {
    transform: rotateY(180deg);
  }

  .brand {
    color: #f4d98a;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
    text-shadow: 0 0 14px rgba(244, 217, 138, 0.35);
  }

  /* ---------- Tarjeta de formulario ---------- */
  .card {
    background: rgba(22, 18, 12, 0.85);
    border: 1px solid #3a2c14;
    border-radius: 18px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    backdrop-filter: blur(6px);
  }
  .card h1 {
    color: #fff;
    font-size: 20px;
    margin-bottom: 22px;
    text-align: center;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    color: #b8a679;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #43341a;
    background: #0d0a05;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .field input:focus {
    border-color: #d4a017;
  }
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #f4d98a, #d4a017);
    color: #241a05;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn:active { opacity: 0.85; }

  .switch-text {
    color: #9a8a63;
    font-size: 13px;
    text-align: center;
    margin-top: 18px;
  }
  .switch-text a {
    color: #f4d98a;
    text-decoration: none;
    font-weight: 600;
  }

  .error {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    display: none;
  }

  /* Pantalla en blanco tras login/registro */
  #app-screen {
    background: #ffffff;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

  <!-- Pantalla LOGIN -->
  <div id="login-screen" class="screen">
    <div class="coin-wrap">
      <div class="coin">
        <div class="coin-face front">🌴</div>
        <div class="coin-face back">🍾</div>
      </div>
    </div>
    <div class="brand">ALCOHOL 365</div>

    <div class="card">
      <h1>Iniciar sesión</h1>
      <form id="login-form">
        <div class="field">
          <label for="login-user">Usuario</label>
          <input type="text" id="login-user" placeholder="tu usuario" required>
        </div>
        <div class="field">
          <label for="login-pass">Contraseña</label>
          <input type="password" id="login-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Entrar</button>
        <div class="error" id="login-error">Rellena usuario y contraseña</div>
      </form>
      <div class="switch-text">
        ¿No tienes cuenta? <a href="#" id="go-register">Regístrate</a>
      </div>
    </div>
  </div>

  <!-- Pantalla REGISTRO -->
  <div id="register-screen" class="screen hidden">
    <div class="coin-wrap">
      <div class="coin">
        <div class="coin-face front">🌴</div>
        <div class="coin-face back">🍾</div>
      </div>
    </div>
    <div class="brand">ALCOHOL 365</div>

    <div class="card">
      <h1>Crear cuenta</h1>
      <form id="register-form">
        <div class="field">
          <label for="reg-user">Usuario</label>
          <input type="text" id="reg-user" placeholder="elige un usuario" required>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="tu@email.com" required>
        </div>
        <div class="field">
          <label for="reg-pass">Contraseña</label>
          <input type="password" id="reg-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Registrarme</button>
        <div class="error" id="register-error">Rellena todos los campos</div>
      </form>
      <div class="switch-text">
        ¿Ya tienes cuenta? <a href="#" id="go-login">Inicia sesión</a>
      </div>
    </div>
  </div>

  <!-- Pantalla tras entrar: en blanco -->
  <div id="app-screen" class="screen hidden"></div>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const registerScreen = document.getElementById('register-screen');
    const appScreen = document.getElementById('app-screen');

    document.getElementById('go-register').addEventListener('click', function (e) {
      e.preventDefault();
      loginScreen.classList.add('hidden');
      registerScreen.classList.remove('hidden');
    });

    document.getElementById('go-login').addEventListener('click', function (e) {
      e.preventDefault();
      registerScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
    });

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const errorMsg = document.getElementById('login-error');

      if (!user || !pass) {
        errorMsg.style.display = 'block';
        return;
      }
      errorMsg.style.display = 'none';

      // Aquí iría la validación real contra un backend.
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
    });

    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const user = document.getElementById('reg-user').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value.trim();
      const errorMsg = document.getElementById('register-error');

      if (!user || !email || !pass) {
        errorMsg.style.display = 'block';
        return;
      }
      errorMsg.style.display = 'none';

      // Aquí iría el alta real contra un backend.
      registerScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
    });
  </script>

</body>
</html>
